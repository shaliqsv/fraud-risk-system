[project]
name = "fraud-risk-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "seaborn",
    "catboost",
    "xgboost",
    "lightgbm",
    "mlflow",
    "shap>=0.46.0",
    "numba>=0.57.0",
    "llvmlite>=0.40.0",
    "evidently",
    "fastapi",
    "uvicorn",
    "pydantic",
    "azure-ai-ml",
    "azure-identity",
    "azureml-mlflow",
    "python-dotenv",
    "azure-storage-blob"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
